{# Status button and panel in the top bar (spec 003, F12-F14). Works without JavaScript. #}
{% set next_path = next_path or request.path %}
<details class="portflow" id="portflow-status" data-state="{{ portflow.state }}" data-poll="{{ portflow.poll_ms }}"
         {% if portflow_open %}open{% endif %}>
  <summary class="portflow-status" aria-label="Portflow-verbinding: {{ portflow.label }}">
    <span class="status-dot dot-{{ portflow.dot }}{% if portflow.pulse %} is-pulsing{% endif %}"></span>
    <span class="status-text">
      <span class="status-label">Portflow</span>
      <span class="status-value">{{ portflow.label }}</span>
      {% if portflow.sub %}<span class="status-sub">{{ portflow.sub }}</span>{% endif %}
    </span>
  </summary>

  <div class="portflow-panel">
    {% include "_portflow_details.html" %}
  </div>
</details>

{% extends "base.html" %}
{# Gilde aanmaken (F14) en bewerken (F16), met de controle van F15; de beroepsrol is een veld van het gilde (spec 018, F2). #}
{% block content %}
<form method="post" class="card names-form">
  {% if error %}<p class="panel-message" role="alert">{{ error }}</p>{% endif %}
  <label>Code <span class="muted">(2 of 3 letters, bijvoorbeeld FE of BIT)</span>
    <input name="code" value="{{ form.code }}" required maxlength="3" autocomplete="off">
  </label>
  <label>Naam <span class="muted">(bijvoorbeeld Front-end gilde)</span>
    <input name="naam" value="{{ form.naam }}" required>
  </label>
  <label>Beroepsrol <span class="muted">(bijvoorbeeld Front-end developer)</span>
    <input name="beroepsrol" value="{{ form.beroepsrol }}" required>
  </label>
  <label>Beschrijving van de beroepsrol <span class="muted">(niet verplicht)</span>
    <textarea name="beschrijving" rows="2">{{ form.beschrijving }}</textarea>
  </label>
  <label>Kleur
    <input type="color" name="kleur" value="{{ form.kleur }}">
  </label>
  <div class="actions">
    <a class="button button-secondary" href="{{ url_for('pages.guilds') }}">Annuleren</a>
    <button class="button button-primary" type="submit">Opslaan</button>
  </div>
</form>
{% endblock %}

{# Simple line icons (24x24, stroke = currentColor), drawn in the style of the designs. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "home" %}
  <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/>
{%- elif name == "users" %}
  <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/>
  <path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.3c2 .7 3.5 2.8 3.5 5.7"/>
{%- elif name == "clipboard" %}
  <rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6M9 18h4"/>
{%- elif name == "folder" %}
  <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>
{%- elif name == "columns" %}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/>
{%- elif name == "briefcase" %}
  <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 13h18"/>
{%- elif name == "calendar" %}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif name == "sliders" %}
  <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/>
  <circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>
{%- elif name == "user" %}
  <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
{%- elif name == "coach" %}
  <circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c0-3.6 2.9-6 6.5-6 1.4 0 2.7.4 3.7 1"/><path d="m15 18 2 2 4-4"/>
{%- elif name == "guild" %}
  <path d="M12 3 4 6v5c0 4.6 3.4 8.5 8 10 4.6-1.5 8-5.4 8-10V6z"/><path d="M9 12h6M12 9v6"/>
{%- elif name == "flag" %}
  <path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>
{%- elif name == "grid" %}
  <rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/>
  <rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>
{%- elif name == "info" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- endif %}
</svg>
{%- endmacro %}

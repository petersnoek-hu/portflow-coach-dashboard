# For uv, used by the install scripts (spec 020). Developers can keep using requirements.txt.
# The version must equal VERSION in dashboard/version.py (tests/test_install.py checks it).
[project]
name = "portflow-coach-dashboard"
version = "0.15.0"
description = "Lokaal dashboard voor Open-ICT-coaches en gildemeesters, op basis van de onofficiële Portflow API"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.12.0",
    "Flask==3.1.3",
    "playwright==1.64.1",
    "pypdf==7.1.1",
]

[tool.uv]
package = false

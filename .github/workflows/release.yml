# Release maken (spec 020, R2): een tag vX.Y.Z pushen. Zie docs/releases.md.
# 1. tests op macOS en Windows; 2. zip met controlesom; 3. installatiescripts proberen op een
# schone Mac en Windows-machine; 4. de release op GitHub, met de releasenote uit releases/vX.Y.Z.md.
# Faalt een stap, dan komt er geen release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Versie in de code gelijk aan de tag
        shell: bash
        run: |
          code=$(python -c "from dashboard.version import VERSION; print(VERSION)")
          test "v$code" = "${GITHUB_REF_NAME}" || { echo "dashboard/version.py zegt $code, de tag is ${GITHUB_REF_NAME}"; exit 1; }
          test -f "releases/${GITHUB_REF_NAME}.md" || { echo "releases/${GITHUB_REF_NAME}.md (de releasenote) ontbreekt"; exit 1; }
      - run: python -m unittest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Zip en controlesom
        run: |
          mkdir dist
          git archive --format=zip -o dist/portflow-coach-dashboard.zip HEAD
          (cd dist && sha256sum portflow-coach-dashboard.zip > portflow-coach-dashboard.zip.sha256)
          cp install/install-macos.sh install/install-windows.ps1 dist/
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Downloads aanbieden zoals GitHub dat doet
        shell: bash
        run: (cd dist && nohup python3 -m http.server 8765 > /dev/null 2>&1 &) ; sleep 2
      - name: Installeren op macOS
        if: runner.os == 'macOS'
        env:
          PORTFLOW_RELEASE_URL: http://127.0.0.1:8765
          PORTFLOW_INSTALL_ROOT: ${{ runner.temp }}/installatie
          PORTFLOW_APPLICATIONS: ${{ runner.temp }}/apps
          PORTFLOW_NO_START: "1"
        run: |
          sh dist/install-macos.sh < /dev/null
          grep "EINDE: gelukt" install.log && grep "OPDRACHT: .*uv.* sync" install.log   # I8: the log
          root="$PORTFLOW_INSTALL_ROOT"
          test -x "$PORTFLOW_APPLICATIONS/Portflow coach dashboard.app/Contents/MacOS/start"
          nohup "$root/venv/bin/python" "$root/app/app.py" --no-browser --port 5099 > app.log 2>&1 &
          # The first start after installing can take a while (Python prepares its files); wait up to 60 s.
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5099/versie > /dev/null 2>&1 && break; sleep 1; done
          echo "Bereikbaar na ongeveer $i s"
          curl -fsS http://127.0.0.1:5099/versie | grep "\"${GITHUB_REF_NAME#v}\"" || { echo "--- app.log ---"; cat app.log; exit 1; }
          test -f "$root/data/dashboard.sqlite3"
          curl -fsS -X POST http://127.0.0.1:5099/afsluiten > /dev/null
          sh dist/install-macos.sh --verwijderen < /dev/null || true
          tail -n 30 install.log
          test ! -d "$root/app" && test -d "$root/data"
      - name: Installeren op Windows (Windows PowerShell 5, zoals bij gebruikers)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PORTFLOW_RELEASE_URL: http://127.0.0.1:8765
          PORTFLOW_NO_START: "1"
        run: |
          $env:PORTFLOW_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP "installatie"
          $root = $env:PORTFLOW_INSTALL_ROOT
          & .\dist\install-windows.ps1
          Get-Content install.log
          if (-not (Select-String -Path install.log -Pattern "EINDE: gelukt")) { throw "install.log meldt geen geslaagde installatie" }
          if (-not (Select-String -Path install.log -Pattern "OPDRACHT: .*uv.* sync")) { throw "install.log mist de opdrachten" }
          if (-not (Test-Path "$root\venv\Scripts\pythonw.exe")) { throw "pythonw.exe ontbreekt" }
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Portflow coach dashboard.lnk"
          if (-not (Test-Path $menu)) { throw "snelkoppeling in het Startmenu ontbreekt" }
          Start-Process -FilePath "$root\venv\Scripts\python.exe" -ArgumentList "`"$root\app\app.py`" --no-browser --port 5099" -WorkingDirectory "$root\app"
          # The first start after installing can take a while (Python prepares its files); wait up to 60 s.
          $answer = $null
          foreach ($i in 1..60) {
            try { $answer = Invoke-RestMethod -Uri "http://127.0.0.1:5099/versie"; break } catch { Start-Sleep -Seconds 1 }
          }
          if ($null -eq $answer) { Get-Content "$root\data\dashboard.log" -ErrorAction SilentlyContinue; throw "het dashboard antwoordt niet binnen 60 s" }
          Write-Host "Bereikbaar na ongeveer $i s"
          if ($answer.version -ne $env:GITHUB_REF_NAME.TrimStart("v")) { throw "verkeerde versie: $($answer.version)" }
          if (-not (Test-Path "$root\data\dashboard.sqlite3")) { throw "database niet in de gegevensmap" }
          try { Invoke-WebRequest -Uri "http://127.0.0.1:5099/afsluiten" -Method Post -UseBasicParsing | Out-Null } catch { }
          Start-Sleep -Seconds 3
          & .\dist\install-windows.ps1 --verwijderen
          Get-Content install.log -Tail 30
          if (Test-Path "$root\app") { throw "app is niet verwijderd" }
          if (-not (Test-Path "$root\data")) { throw "gegevens zijn verwijderd" }

  release:
    needs: install-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Release op GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # De releasenote, met daaronder de installatieregels (spec 020, I1)
          cat "releases/${GITHUB_REF_NAME}.md" install/release-installatie.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Versie ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"

# Tests bij elke push naar main (en bij een pull request): op macOS en Windows, zoals de release-
# workflow. Zo komt een fout die alleen op één systeem optreedt meteen aan het licht, en niet pas
# bij het maken van een release. Zie docs/releases.md.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest
